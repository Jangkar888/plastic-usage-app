<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Plastic Usage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♻️</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f9fafb; --border:#e2e4e9;
    --text:#1b1e24; --text-muted:#6b7280;
    --accent:#2563eb; --accent-contrast:#ffffff; --accent-soft:#e8effe;
    --success:#15803d; --success-soft:#e7f6ec;
    --warning:#b45309; --warning-soft:#fef3e0;
    --danger:#b91c1c; --danger-soft:#fdeaea;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --surface:#1d2026; --surface-2:#22262e; --border:#31353e;
      --text:#e7e9ee; --text-muted:#9aa0ab;
      --accent:#5b8def; --accent-contrast:#0b1220; --accent-soft:#1d2a44;
      --success:#4ade80; --success-soft:#123120;
      --warning:#f5a623; --warning-soft:#3a2a10;
      --danger:#f87171; --danger-soft:#3a1616;
    }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; margin:0; }
  #nav{ position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:4px; flex-wrap:wrap; background:var(--surface); border-bottom:1px solid var(--border); padding:10px 16px; }
  #nav .brand{ font-weight:700; margin-right:16px; white-space:nowrap; }
  #nav button.tab-btn{ background:transparent; border:none; color:var(--text-muted); font-size:14px; font-weight:600; padding:8px 12px; border-radius:8px; cursor:pointer; }
  #nav button.tab-btn:hover{ background:var(--surface-2); color:var(--text); }
  #nav button.tab-btn.active{ background:var(--accent-soft); color:var(--accent); }
  #nav .spacer{ flex:1; }
  #nav .who{ font-size:13px; color:var(--text-muted); margin-right:10px; }
  #app{ max-width:980px; margin:0 auto; padding:20px 16px 60px; }
  h2{ margin:0 0 4px; font-size:20px; }
  h3{ margin:24px 0 10px; font-size:15px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
  .subtext{ color:var(--text-muted); font-size:13px; margin:0 0 16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:18px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .stat .num{ font-size:26px; font-weight:700; }
  .stat .label{ color:var(--text-muted); font-size:13px; margin-top:2px; }
  form.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; align-items:end; }
  form.form-grid .field{ display:flex; flex-direction:column; gap:4px; }
  form.form-grid .field.full{ grid-column:1 / -1; }
  label{ font-size:12px; color:var(--text-muted); font-weight:600; }
  input,select,textarea{ background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; }
  textarea{ resize:vertical; min-height:60px; }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  input.invalid,select.invalid{ border-color:var(--danger); outline:2px solid var(--danger); outline-offset:1px; }
  button{ font-family:inherit; }
  .btn{ background:var(--accent); color:var(--accent-contrast); border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn:hover{ opacity:.92; }
  .btn.secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn.danger{ background:var(--danger-soft); color:var(--danger); border:1px solid transparent; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .btn-icon{ background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:4px 8px; border-radius:6px; }
  .btn-icon:hover{ background:var(--danger-soft); color:var(--danger); }
  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table{ border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px; }
  th,td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th{ color:var(--text-muted); font-weight:600; background:var(--surface-2); position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }
  tr.cat-row td{ background:var(--surface-2); font-weight:700; color:var(--text-muted); text-transform:uppercase; font-size:11.5px; letter-spacing:.04em; }
  /* keep the action column visible when a wide table scrolls sideways */
  .table-wrap td:last-child, .table-wrap th:last-child{
    position:sticky; right:0; background:var(--surface); z-index:1;
    box-shadow:-7px 0 8px -7px rgba(0,0,0,.25);
  }
  .table-wrap th:last-child{ background:var(--surface-2); z-index:3; }
  tr.cat-row td{ position:static !important; box-shadow:none !important; }
  .empty{ color:var(--text-muted); font-size:13.5px; padding:18px; text-align:center; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .badge.requested{ background:var(--warning-soft); color:var(--warning); }
  .badge.waiting{ background:var(--accent-soft); color:var(--accent); }
  .badge.received{ background:var(--success-soft); color:var(--success); }
  .badge.partial{ background:var(--warning-soft); color:var(--warning); }
  .prog{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .badge.role{ background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted); }
  .type-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:5px 6px 5px 12px; font-size:13px; }
  .spec-hint{ display:block; color:var(--text-muted); font-size:11.5px; min-height:14px; margin-top:2px; }
  .banner{ background:var(--warning-soft); color:var(--warning); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .banner.ok{ background:var(--success-soft); color:var(--success); }
  .role-hint{ font-size:12px; color:var(--text-muted); font-style:italic; margin:-8px 0 14px; }
  .activity-item{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .activity-item:last-child{ border-bottom:none; }
  .activity-item .when{ color:var(--text-muted); font-size:12px; white-space:nowrap; }
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; width:100%; max-width:360px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .login-card h1{ font-size:22px; margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .login-card p.sub{ color:var(--text-muted); font-size:13px; margin:0 0 22px; }
  .login-card .field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .login-card input{ padding:11px 12px; font-size:15px; }
  .login-card button{ width:100%; margin-top:6px; padding:12px; font-size:15px; }
  .login-error{ background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:9px 12px; font-size:13px; margin-bottom:14px; display:none; }
  #app-shell{ display:none; }
  .hidden{ display:none !important; }

  /* ---- PO modal ---- */
  #po-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 16px; }
  #po-overlay.open{ display:flex; }
  .po-modal{ background:var(--surface); border-radius:14px; width:100%; max-width:820px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .po-modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); }
  .po-modal-head h3{ margin:0; font-size:16px; text-transform:none; letter-spacing:0; color:var(--text); }
  .po-modal-body{ padding:20px; }
  .po-modal-foot{ display:flex; gap:10px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .po-close{ background:transparent; border:none; font-size:22px; line-height:1; color:var(--text-muted); cursor:pointer; padding:2px 8px; border-radius:6px; }
  .po-close:hover{ background:var(--surface-2); color:var(--text); }

  /* ---- Printable PO document ---- */
  #po-doc{ background:#ffffff; color:#111827; padding:34px 38px; font-family:Arial, Helvetica, sans-serif; }
  #po-doc .po-header{ display:flex; align-items:center; gap:18px; border-bottom:3px solid #c41e3a; padding-bottom:14px; }
  #po-doc .po-header img{ width:74px; height:auto; flex:none; }
  #po-doc .po-company{ flex:1; text-align:center; }
  #po-doc .po-company .nm{ font-size:26px; font-weight:800; letter-spacing:.5px; color:#111827; }
  #po-doc .po-company .addr{ font-size:11.5px; font-weight:600; color:#374151; margin-top:3px; line-height:1.45; }
  #po-doc h2.po-title{ text-align:center; font-size:19px; letter-spacing:2px; margin:22px 0 4px; color:#111827; }
  #po-doc .po-meta{ display:flex; justify-content:space-between; gap:24px; margin-top:18px; font-size:12.5px; }
  #po-doc .po-meta .blk{ line-height:1.7; }
  #po-doc .po-meta .lbl{ color:#6b7280; }
  #po-doc table.po-items{ width:100%; border-collapse:collapse; margin-top:20px; font-size:12.5px; min-width:0; }
  #po-doc table.po-items th{ background:#f3f4f6; border:1px solid #d1d5db; padding:9px 10px; text-align:left; color:#111827; font-weight:700; position:static; white-space:normal; }
  #po-doc table.po-items td{ border:1px solid #d1d5db; padding:9px 10px; white-space:normal; }
  #po-doc table.po-items td.num, #po-doc table.po-items th.num{ text-align:right; }
  #po-doc .po-total-row td{ font-weight:700; background:#f9fafb; }
  #po-doc .po-notes{ margin-top:16px; font-size:12px; color:#374151; }
  #po-doc .po-sign{ display:flex; justify-content:space-between; margin-top:44px; font-size:12.5px; text-align:center; }
  #po-doc .po-sign .box{ width:44%; }
  #po-doc .po-sign .line{ margin-top:58px; border-top:1px solid #9ca3af; padding-top:6px; color:#374151; }

  @media print{
    body > *{ display:none !important; }
    #po-overlay{ display:block !important; position:static !important; background:#fff !important; padding:0 !important; overflow:visible !important; }
    #po-overlay .po-modal{ box-shadow:none !important; max-width:none !important; border-radius:0 !important; background:#fff !important; }
    .po-modal-head, .po-modal-foot, #po-form-wrap{ display:none !important; }
    .po-modal-body{ padding:0 !important; }
    #po-doc{ padding:0 !important; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1>♻️ Project Plastic Usage</h1>
    <p class="sub">Masuk dengan username dan password Anda.</p>
    <div class="login-error" id="login-error"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" autocapitalize="off" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit" id="login-submit">Masuk</button>
  </form>
</div>

<div id="app-shell">
  <nav id="nav">
    <span class="brand">♻️ Project Plastic Usage</span>
    <button class="tab-btn" data-tab="dashboard">Dasbor Plastik</button>
    <button class="tab-btn" data-tab="usage">Pemakaian Harian</button>
    <button class="tab-btn" data-tab="orders">Pesanan Pembelian</button>
    <button class="tab-btn" data-tab="incoming">Plastik Masuk</button>
    <button class="tab-btn" data-tab="settings">Pengaturan</button>
    <span class="spacer"></span>
    <span class="who" id="who-label"></span>
    <button class="btn secondary" id="logout-btn" style="padding:7px 12px;font-size:13px;">Keluar</button>
  </nav>
  <div id="app"></div>
</div>

<div id="po-overlay">
  <div class="po-modal">
    <div class="po-modal-head">
      <h3 id="po-modal-title">Buat Purchase Order</h3>
      <button class="po-close" data-action="close-po" title="Tutup">&times;</button>
    </div>
    <div class="po-modal-body">
      <div id="po-form-wrap"></div>
      <div id="po-doc"></div>
    </div>
    <div class="po-modal-foot" id="po-foot"></div>
  </div>
</div>

  var UNITS = ["kg","roll"];

  var STATUS_LABEL = { "Requested":"Diminta", "Waiting for Shipment":"Menunggu Pengiriman", "Partially Received":"Diterima Sebagian", "Received":"Diterima" };
  function statusLabel(s){ return STATUS_LABEL[s] || s; }
  var PO_STATUS_LABEL = { "Open":"Terbuka", "Partially Received":"Diterima Sebagian", "Closed":"Selesai" };
  function poStatusLabel(s){ return PO_STATUS_LABEL[s] || s; }

  var state = {
    plasticTypes: [],      // [{id,name,category,size,unit,current_stock}]
    suppliers: [],         // [{id,name}]
    settings: { purchasingEmail:"", purchasingWhatsapp:"" },
    dailyUsage: [],
    purchaseRequests: [],
    incoming: [],
    purchaseOrders: [],    // [{id,po_number,po_date,supplier,notes,status,...}]
    poItems: []            // [{id,po_id,plastic_type,size,unit,order_quantity,unit_price,received_quantity,request_id}]
  };
  var session = null;
  var profile = null;      // {id, display_name, role}
  var activeTab = "dashboard";
  var channels = [];

  // ---------- helpers ----------
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function pad2(n){ return String(n).padStart(2,"0"); }
  function todayIso(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function formatDate(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
    return d.toLocaleDateString("id-ID",{year:"numeric",month:"short",day:"numeric"});
  }
  function formatDateTime(ts){
    if(!ts) return "";
    return new Date(ts).toLocaleString("id-ID",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function fmtQty(q,unit){
    if(q==null) return "—";
    var n = Number(q);
    var s = (Math.round(n*100)/100).toString();
    return s + " " + (unit||"");
  }
  function isRollSize(size){
    if(!size) return false;
    var parts = String(size).split("x").map(function(p){ return p.trim(); });
    return parts.length>=2 && parts[parts.length-1]==="1000";
  }
  function digitsOnly(str){ return String(str||"").replace(/[^0-9]/g,""); }
  function toast(msg, kind){
    var t = document.createElement("div");
    t.textContent = msg;
    Object.assign(t.style, {
      position:"fixed", bottom:"20px", left:"50%", transform:"translateX(-50%)",
      background: kind==="error" ? "var(--danger)" : "var(--accent)",
      color:"var(--accent-contrast)", padding:"10px 18px", borderRadius:"8px",
      boxShadow:"0 4px 16px rgba(0,0,0,.25)", zIndex:9999, fontSize:"14px",
      maxWidth:"90vw", textAlign:"center"
    });
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, kind==="error" ? 7000 : 3800);
  }
  function markInvalid(form, name){
    Array.prototype.forEach.call(form.querySelectorAll(".invalid"), function(el){ el.classList.remove("invalid"); });
    var el = form.querySelector('[name="'+name+'"]');
    if(el){ el.classList.add("invalid"); try{ el.scrollIntoView({block:"center", behavior:"smooth"}); }catch(e){} el.focus(); }
  }
  function role(){ return profile ? profile.role : "staff"; }
  function isAdmin(){ return role()==="admin"; }
  function isOwnRow(r){ return !!(session && session.user && r && r.created_by === session.user.id); }
  function canDeleteUsage(r){ return isAdmin() || isOwnRow(r); }
  // requests stay deletable only while nothing has acted on them yet
  function canDeleteRequest(r, onPo){ return r.status==="Requested" && !onPo && (isAdmin() || isOwnRow(r)); }
  function isPurchasing(){ return role()==="purchasing" || role()==="admin"; }
  function isStaff(){ return role()==="staff" || role()==="admin"; }

  function typesByCategory(){
    var byCat = {};
    CATEGORY_ORDER.forEach(function(c){ byCat[c]=[]; });
    state.plasticTypes.forEach(function(t){
      var c = t.category || "Jarang Dipakai";
      if(!byCat[c]) byCat[c]=[];
      byCat[c].push(t);
    });
    return byCat;
  }
  function typeOptions(selected){
    var byCat = typesByCategory();
    var html = '<option value="">Pilih jenis…</option>';
    CATEGORY_ORDER.forEach(function(cat){
      var list = byCat[cat];
      if(!list || !list.length) return;
      html += '<optgroup label="'+escapeHtml(cat)+'">';
      list.forEach(function(t){
        var label = t.size ? (t.name+' — '+t.size) : t.name;
        html += '<option value="'+escapeHtml(t.name)+'"'+(t.name===selected?' selected':'')+'>'+escapeHtml(label)+'</option>';
      });
      html += '</optgroup>';
    });
    return html;
  }
  function unitOptions(selected){
    return UNITS.map(function(u){ return '<option value="'+u+'"'+(u===selected?' selected':'')+'>'+u+'</option>'; }).join("");
  }
  function supplierOptions(selected){
    return '<option value="">Pilih pemasok…</option>' + state.suppliers.map(function(s){
      return '<option value="'+escapeHtml(s.name)+'"'+(s.name===selected?' selected':'')+'>'+escapeHtml(s.name)+'</option>';
    }).join("");
  }
  function findType(name){ return state.plasticTypes.find(function(t){ return t.name===name; }); }

  // ---------- auth ----------
  function resolveEmail(usernameOrEmail){
    var v = String(usernameOrEmail||"").trim().toLowerCase();
    if(v.indexOf("@")!==-1) return v;
    return v + "@" + AUTH_DOMAIN;
  }

  async function doLogin(username, password){
    var email = resolveEmail(username);
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if(res.error) throw res.error;
    return res.data.session;
  }

  async function loadProfile(userId){
    var res = await sb.from("profiles").select("*").eq("id", userId).single();
    if(res.error){ return { id:userId, display_name:"", role:"staff" }; }
    return res.data;
  }

  // ---------- data loading ----------
  async function loadAll(){
    var [pt, sup, settings, du, pr, inc, po, poi] = await Promise.all([
      sb.from("plastic_types").select("*").order("category").order("name"),
      sb.from("suppliers").select("*").order("name"),
      sb.from("app_settings").select("*"),
      sb.from("daily_usage").select("*").order("created_at", {ascending:false}),
      sb.from("purchase_requests").select("*").order("created_at", {ascending:false}),
      sb.from("incoming").select("*").order("created_at", {ascending:false}),
      sb.from("purchase_orders").select("*").order("created_at", {ascending:false}),
      sb.from("purchase_order_items").select("*").order("created_at", {ascending:true}),
    ]);
    state.plasticTypes = (pt.data||[]).sort(function(a,b){
      var ca = CATEGORY_ORDER.indexOf(a.category), cb = CATEGORY_ORDER.indexOf(b.category);
      if(ca!==cb) return ca-cb;
      return 0;
    });
    state.suppliers = sup.data || [];
    var settingsMap = {};
    (settings.data||[]).forEach(function(row){ settingsMap[row.key]=row.value; });
    state.settings = { purchasingEmail: settingsMap.purchasingEmail||"", purchasingWhatsapp: settingsMap.purchasingWhatsapp||"" };
    state.dailyUsage = du.data || [];
    state.purchaseRequests = pr.data || [];
    state.incoming = inc.data || [];
    state.purchaseOrders = po.data || [];
    state.poItems = poi.data || [];
  }

  // ---------- PO helpers ----------
  function itemsOfPo(poId){
    return state.poItems.filter(function(i){ return i.po_id===poId; });
  }
  function poOfItem(itemId){
    var it = state.poItems.find(function(i){ return i.id===itemId; });
    return it ? state.purchaseOrders.find(function(p){ return p.id===it.po_id; }) : null;
  }
  function requestIsOnPo(requestId){
    return state.poItems.some(function(i){ return i.request_id===requestId; });
  }
  function poTotal(poId){
    return itemsOfPo(poId).reduce(function(sum,i){
      var q = Number(i.order_quantity||0), p = Number(i.unit_price||0);
      return sum + (q*p);
    }, 0);
  }
  // A PO's status derived from its line items
  function recomputePoStatus(poId){
    var items = itemsOfPo(poId);
    if(!items.length) return "Open";
    var anyReceived = items.some(function(i){ return Number(i.received_quantity||0) > 0; });
    return anyReceived ? "Partially Received" : "Open";
  }

  function subscribeRealtime(){
    channels.forEach(function(ch){ sb.removeChannel(ch); });
    channels = [];
    ["daily_usage","purchase_requests","incoming","plastic_types","suppliers","app_settings","purchase_orders","purchase_order_items"].forEach(function(table){
      var ch = sb.channel("rt-"+table)
        .on("postgres_changes", { event:"*", schema:"public", table:table }, function(){
          loadAll().then(render);
        })
        .subscribe();
      channels.push(ch);
    });
  }

  // ---------- renderers ----------
  function renderDashboard(){
    var pending = state.purchaseRequests.filter(function(r){ return r.status==="Requested"; }).length;
    var openPoCount = state.purchaseOrders.filter(function(p){ return p.status!=="Closed"; }).length;
    var now = new Date();
    var receivedThisMonth = state.incoming.filter(function(i){
      var d = new Date(i.date_received);
      return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    }).length;
    var usageCount = state.dailyUsage.length;

    var events = [];
    state.dailyUsage.forEach(function(u){ events.push({ ts:new Date(u.created_at).getTime(), text:"Pemakaian dicatat: "+fmtQty(u.quantity,u.unit)+" "+escapeHtml(u.plastic_type)+(u.staff_name?" oleh "+escapeHtml(u.staff_name):"") }); });
    state.purchaseRequests.forEach(function(r){ events.push({ ts:new Date(r.created_at).getTime(), text:"Permintaan pembelian: "+escapeHtml(r.plastic_type)+" (stok "+fmtQty(r.stock,r.unit)+")"+(r.requested_by?" oleh "+escapeHtml(r.requested_by):"") }); });
    state.incoming.forEach(function(i){ events.push({ ts:new Date(i.created_at).getTime(), text:"Plastik masuk: "+fmtQty(i.quantity,i.unit)+" "+escapeHtml(i.plastic_type)+(i.supplier?" dari "+escapeHtml(i.supplier):"") }); });

  function renderTab(tab){
    if(tab==="usage") return renderUsage();
    if(tab==="orders") return renderOrders();
    if(tab==="incoming" && isPurchasing()) return renderIncoming();
    if(tab==="settings" && isPurchasing()) return renderSettings();
    return renderDashboard();
  }

  function visibleTabs(){
    if(isPurchasing()) return ["dashboard","usage","orders","incoming","settings"];
    return ["dashboard","usage","orders"];
  }

  function render(){
    var tabs = visibleTabs();
    if(tabs.indexOf(activeTab)===-1) activeTab = "dashboard";
    Array.prototype.forEach.call(document.querySelectorAll("#nav .tab-btn"), function(b){
      var t = b.getAttribute("data-tab");
      b.classList.toggle("hidden", tabs.indexOf(t)===-1);
      b.classList.toggle("active", t===activeTab);
    });
    document.getElementById("who-label").textContent = (profile ? (profile.display_name||"") : "") + " · " + roleLabel(role());
    document.getElementById("app").innerHTML = renderTab(activeTab);
  }
  function roleLabel(r){
    return { staff:"Staf produksi", purchasing:"Staf pembelian", admin:"Admin" }[r] || r;
  }

  // ---------- Purchase Order ----------
  function fmtRupiah(n){
    if(n==null || isNaN(n)) return "—";
    return "Rp " + Number(n).toLocaleString("id-ID", {minimumFractionDigits:0, maximumFractionDigits:2});
  }

  // draft line items while building a PO (in-memory only)
  var poDraft = { supplier:"", notes:"", items:[] };

  function openPoBuilder(preselectRequestIds){
    poDraft = { supplier:"", notes:"", items:[] };
    (preselectRequestIds||[]).forEach(function(rid){
      var r = state.purchaseRequests.find(function(x){ return x.id===rid; });
      if(!r) return;
      var t = findType(r.plastic_type);
      poDraft.items.push({
        key: uid(),
        plastic_type: r.plastic_type,
        size: (t && t.size) ? t.size : "",
        unit: r.unit || "kg",
        order_quantity: "",
        unit_price: "",
        request_id: r.id,
        requested_by: r.requested_by || "",
        stock: r.stock
      });
    });
    document.getElementById("po-modal-title").textContent = "Buat Purchase Order";
    document.getElementById("po-doc").innerHTML = "";
    document.getElementById("po-foot").innerHTML =
      '<button class="btn secondary" data-action="close-po">Batal</button>'+
      '<button class="btn" data-action="save-po">Simpan PO</button>';
    renderPoBuilder();
    document.getElementById("po-overlay").classList.add("open");
  }

  function renderPoDoc(p){

    var dateStr = new Date(p.po_date + "T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});

    var h = "";
    h += '<div class="po-header">';
    h += '<img src="'+LOGO_DATA_URI+'" alt="Logo">';
    h += '<div class="po-company"><div class="nm">'+escapeHtml(COMPANY.name)+'</div>'+
         '<div class="addr">'+escapeHtml(COMPANY.address)+'<br>'+escapeHtml(COMPANY.contact)+'</div></div>';
    h += '</div>';

    h += '<h2 class="po-title">PURCHASE ORDER</h2>';

    h += '<div class="po-meta">';
    h += '<div class="blk"><div><span class="lbl">Kepada (Pemasok):</span></div>'+
         '<div><strong>'+escapeHtml(p.supplier||"—")+'</strong></div></div>';
    h += '<div class="blk" style="text-align:right;">'+
         '<div><span class="lbl">No. PO:</span> <strong>'+escapeHtml(p.po_number)+'</strong></div>'+
         '<div><span class="lbl">Tanggal:</span> '+escapeHtml(dateStr)+'</div>'+
         '</div>';

         '<th class="num">Jumlah</th><th class="num">Harga Satuan</th><th class="num">Total</th>'+
         '</tr></thead><tbody>';
    var grand = 0;
    items.forEach(function(it, idx){
      var q = Number(it.order_quantity||0), pr = Number(it.unit_price||0);
      var lineTotal = q*pr;
      grand += lineTotal;
      h += '<tr><td>'+(idx+1)+'</td><td>'+escapeHtml(it.plastic_type)+'</td><td>'+escapeHtml(it.size||"—")+'</td>'+
           '<td class="num">'+escapeHtml(fmtQty(it.order_quantity, it.unit))+'</td>'+
           '<td class="num">'+escapeHtml(fmtRupiah(it.unit_price))+'</td>'+
           '<td class="num">'+escapeHtml(fmtRupiah(lineTotal))+'</td></tr>';
    });
    h += '<tr class="po-total-row"><td colspan="5" class="num">TOTAL</td>'+
         '<td class="num">'+escapeHtml(fmtRupiah(grand))+'</td></tr>';

      h += '<div class="po-notes"><strong>Catatan:</strong> '+escapeHtml(p.notes)+'</div>';

         '<div class="box"><div>Hormat kami,</div><div class="line">'+escapeHtml(COMPANY.name)+'</div></div>'+
         '<div class="box"><div>Diterima oleh,</div><div class="line">'+escapeHtml(p.supplier||"Pemasok")+'</div></div>'+
         '</div>';
    return h;

  function buildNotifyLinks(){
    var pending = state.purchaseRequests.filter(function(r){ return r.status==="Requested"; });
    if(pending.length===0){
      return '<span class="btn secondary" style="opacity:.5;cursor:not-allowed;">📧 Email daftar ke staf pembelian</span>'+
        '<span class="btn secondary" style="opacity:.5;cursor:not-allowed;">💬 WhatsApp daftar ke staf pembelian</span>';
    }
    var lines = pending.map(function(r){
      return "- " + r.plastic_type + ": stok saat ini " + fmtQty(r.stock,r.unit) + (r.requested_by?" (diminta oleh "+r.requested_by+")":"") + (r.notes?" — "+r.notes:"");
    });
    var body = "Mohon cek stok plastik berikut dan tentukan jumlah pembelian:\n\n" + lines.join("\n") + "\n\nDikirim dari Project Plastic Usage.";
    var mailHtml, waHtml;
    if(state.settings.purchasingEmail){
      var mailUrl = "mailto:" + encodeURIComponent(state.settings.purchasingEmail) + "?subject=" + encodeURIComponent("Daftar permintaan pembelian plastik") + "&body=" + encodeURIComponent(body);
      mailHtml = '<a class="btn secondary" href="'+escapeHtml(mailUrl)+'">📧 Email daftar ke staf pembelian</a>';
    } else {
      mailHtml = '<span class="btn secondary" style="opacity:.5;cursor:not-allowed;" title="Isi email staf pembelian di Pengaturan">📧 Email daftar ke staf pembelian</span>';
    }
    var phone = digitsOnly(state.settings.purchasingWhatsapp);
    if(phone){
      var waUrl = "https://wa.me/" + phone + "?text=" + encodeURIComponent(body);
      waHtml = '<a class="btn secondary" href="'+escapeHtml(waUrl)+'" target="_blank" rel="noopener noreferrer">💬 WhatsApp daftar ke staf pembelian</a>';
    } else {
      waHtml = '<span class="btn secondary" style="opacity:.5;cursor:not-allowed;" title="Isi WhatsApp staf pembelian di Pengaturan">💬 WhatsApp daftar ke staf pembelian</span>';
    }
    return mailHtml + waHtml;
  }

  // ---------- mutations ----------
  async function handleFormSubmit(e){
    var form = e.target.closest("form[data-form]");
    if(!form) return;
    e.preventDefault();
    var kind = form.getAttribute("data-form");
    var data = formData(form);

    try{
      if(kind==="usage"){
        if(!data.plasticType){ toast("Mohon pilih jenis plastik terlebih dahulu.", "error"); markInvalid(form,"plasticType"); return; }
        if(!data.quantity || Number(data.quantity)<=0){ toast("Mohon isi jumlah (harus lebih dari 0).", "error"); markInvalid(form,"quantity"); return; }
        var ins = await sb.from("daily_usage").insert({
          usage_date: data.date||todayIso(), plastic_type: data.plasticType, quantity: Number(data.quantity),
          unit: data.unit||"kg", staff_name: data.staffName||"", created_by: session.user.id
        });
        if(ins.error) throw ins.error;
        toast("Catatan pemakaian ditambahkan.");
        form.reset();
        await loadAll(); render();
      } else if(kind==="request"){
        if(!data.plasticType){ toast("Mohon pilih jenis plastik terlebih dahulu.", "error"); markInvalid(form,"plasticType"); return; }
        if(!data.stock || Number(data.stock)<=0){ toast("Mohon isi stok saat ini (harus lebih dari 0).", "error"); markInvalid(form,"stock"); return; }
        var ins2 = await sb.from("purchase_requests").insert({
          request_date: todayIso(), plastic_type: data.plasticType, stock: Number(data.stock), unit: data.unit||"kg",
          requested_by: data.requestedBy||"", notes: data.notes||"", status:"Requested", created_by: session.user.id
        });
        if(ins2.error) throw ins2.error;
        toast("Permintaan pembelian terkirim.");
        form.reset();
        await loadAll(); render();
      } else if(kind==="incoming"){
        if(!data.plasticType){ toast("Mohon pilih jenis plastik terlebih dahulu.", "error"); markInvalid(form,"plasticType"); return; }
        if(!data.quantity || Number(data.quantity)<=0){ toast("Mohon isi jumlah (harus lebih dari 0).", "error"); markInvalid(form,"quantity"); return; }
        var poItem = data.linkedRequestId ? state.poItems.find(function(i){ return i.id===data.linkedRequestId; }) : null;
        var entry = {
          date_received: data.dateReceived||todayIso(), plastic_type: data.plasticType, quantity: Number(data.quantity),
          unit: data.unit||"kg", supplier: data.supplier||"", received_by: data.receivedBy||"",
          po_item_id: poItem ? poItem.id : null,
          linked_request_id: (poItem && poItem.request_id) ? poItem.request_id : null,
          created_by: session.user.id
        };
        var insInc = await sb.from("incoming").insert(entry).select().single();
        if(insInc.error) throw insInc.error;

        var closeMsg = "";
        if(poItem){
          var newTotal = Number(poItem.received_quantity||0) + Number(data.quantity);
          var wantClose = form.querySelector('[name="closePo"]') && form.querySelector('[name="closePo"]').checked;

          var updItem = await sb.from("purchase_order_items")
            .update({ received_quantity: newTotal }).eq("id", poItem.id);
          if(updItem.error) throw updItem.error;

          var parentPo = state.purchaseOrders.find(function(p){ return p.id===poItem.po_id; });
          if(wantClose){
            // close the whole PO
            var siblings = itemsOfPo(poItem.po_id);
            var shortfalls = [];
            siblings.forEach(function(si){
              var ord = Number(si.order_quantity||0);
              var got = (si.id===poItem.id) ? newTotal : Number(si.received_quantity||0);
              if(Math.abs(ord-got) > 0.001){ shortfalls.push(si.plastic_type + " (" + fmtQty(got,si.unit) + " dari " + fmtQty(ord,si.unit) + ")"); }
            });
            var poPatch = { status:"Closed", closed_at:new Date().toISOString() };
            if(shortfalls.length){ poPatch.close_note = "Ditutup manual: " + shortfalls.join("; ") + "."; }
            var updPo = await sb.from("purchase_orders").update(poPatch).eq("id", poItem.po_id);
            if(updPo.error) throw updPo.error;

            var closeReqIds = siblings.filter(function(si){ return si.request_id; }).map(function(si){ return si.request_id; });
            if(closeReqIds.length){
              await sb.from("purchase_requests").update({ status:"Received", closed_at:new Date().toISOString() }).in("id", closeReqIds);
            }
            closeMsg = " PO " + (parentPo?parentPo.po_number:"") + " ditutup (selesai).";
          } else {
            if(parentPo && parentPo.status==="Open"){
              await sb.from("purchase_orders").update({ status:"Partially Received" }).eq("id", parentPo.id);
            }
            if(poItem.request_id){
              await sb.from("purchase_requests").update({ status:"Partially Received", received_at:new Date().toISOString() }).eq("id", poItem.request_id);
            }
            var ordQ = Number(poItem.order_quantity||0);
            closeMsg = " PO masih terbuka — " + poItem.plastic_type + ": diterima " + fmtQty(newTotal, poItem.unit) +
                       " dari " + fmtQty(ordQ, poItem.unit) + ".";
          }
        }
        toast("Plastik masuk telah dicatat." + closeMsg);
        form.reset();
        await loadAll(); render();
      } else if(kind==="add-type"){
        var name = (data.typeName||"").trim();
        if(!name) return;
        if(findType(name)){ toast("Jenis tersebut sudah ada.", "error"); return; }
        var size = (data.typeSize||"").trim();
        var unit = (data.typeUnit||"") || (isRollSize(size) ? "roll" : "kg");
        var insT = await sb.from("plastic_types").insert({ name:name, category:data.typeCategory||"Jarang Dipakai", size:size, unit:unit });
        if(insT.error) throw insT.error;
        toast("Jenis plastik ditambahkan.");
        form.reset();
        await loadAll(); render();
      } else if(kind==="add-supplier"){
        var supName = (data.supplierName||"").trim();
        if(!supName) return;
        if(state.suppliers.some(function(s){return s.name===supName;})){ toast("Pemasok tersebut sudah ada.", "error"); return; }
        var insS = await sb.from("suppliers").insert({ name: supName });
        if(insS.error) throw insS.error;
        toast("Pemasok ditambahkan.");
        form.reset();
        await loadAll(); render();
      } else if(kind==="save-settings"){
        var email = (data.purchasingEmail||"").trim();
        var wa = (data.purchasingWhatsapp||"").trim();
        var r1 = await sb.from("app_settings").upsert({ key:"purchasingEmail", value: email });
        var r2 = await sb.from("app_settings").upsert({ key:"purchasingWhatsapp", value: wa });
        if(r1.error) throw r1.error;
        if(r2.error) throw r2.error;
        toast("Kontak berhasil disimpan.");
        await loadAll(); render();
      }
    } catch(err){
      console.error(err);
      toast("Gagal menyimpan ("+(err.message||"error")+").", "error");
    }
  }

  async function handleClick(e){
    var el;
    if((el = e.target.closest('[data-action="delete-usage"]'))){
      if(!confirm("Hapus catatan pemakaian ini?")) return;
      var d1 = await sb.from("daily_usage").delete().eq("id", el.getAttribute("data-id"));
      if(d1.error){ toast("Gagal menghapus. Anda hanya bisa menghapus catatan yang Anda buat sendiri.", "error"); return; }
      await loadAll(); render(); return;
    }
    if((el = e.target.closest('[data-action="delete-request"]'))){
      if(!confirm("Hapus permintaan pembelian ini?")) return;
      var d2 = await sb.from("purchase_requests").delete().eq("id", el.getAttribute("data-id"));
      if(d2.error){ toast("Gagal menghapus. Anda hanya bisa menghapus permintaan yang Anda buat sendiri.", "error"); return; }
      await loadAll(); render(); return;
    }
    if((el = e.target.closest('[data-action="delete-incoming"]'))){
      if(!confirm("Hapus catatan plastik masuk ini?")) return;
      var d3 = await sb.from("incoming").delete().eq("id", el.getAttribute("data-id"));
      if(d3.error){ toast("Gagal menghapus.", "error"); return; }
      await loadAll(); render(); return;
    }
    if((el = e.target.closest('[data-action="remove-type"]'))){
      var tName = el.getAttribute("data-name");
      if(!confirm('Hapus jenis plastik "'+tName+'"?')) return;
      var d4 = await sb.from("plastic_types").delete().eq("name", tName);
      if(d4.error){ toast("Gagal menghapus.", "error"); return; }
      await loadAll(); render(); return;
    }
    if((el = e.target.closest('[data-action="remove-supplier"]'))){
      var sName = el.getAttribute("data-name");
      if(!confirm('Hapus pemasok "'+sName+'"?')) return;
      var d5 = await sb.from("suppliers").delete().eq("name", sName);
      if(d5.error){ toast("Gagal menghapus.", "error"); return; }
      await loadAll(); render(); return;
    }
    if((el = e.target.closest('[data-action="new-po"]'))){
      var picked = Array.prototype.slice.call(document.querySelectorAll('[data-role="pick-request"]:checked'))
        .map(function(cb){ return cb.getAttribute("data-id"); });
      openPoBuilder(picked);
      return;
    }
    if((el = e.target.closest('[data-action="view-po"]'))){
      openPoView(el.getAttribute("data-id")); return;
    }
    if((el = e.target.closest('[data-action="add-po-item"]'))){
      var typeSel = document.querySelector('[data-role="adhoc-type"]');
      var tname = typeSel ? typeSel.value : "";
      if(!tname){ toast("Pilih jenis plastik dulu.", "error"); return; }
      if(poDraft.items.some(function(i){ return i.plastic_type===tname; })){
        toast("Jenis itu sudah ada di PO ini.", "error"); return;
      }
      var t = findType(tname);
      poDraft.items.push({
        key: uid(), plastic_type: tname,
        size: (t&&t.size)?t.size:"", unit: (t&&t.unit)?t.unit:"kg",
        order_quantity:"", unit_price:"", request_id:null, requested_by:"", stock:null
      });
      renderPoBuilder();
      return;
    }
    if((el = e.target.closest('[data-action="remove-po-item"]'))){
      var k = el.getAttribute("data-key");
      poDraft.items = poDraft.items.filter(function(i){ return i.key!==k; });
      renderPoBuilder();
      return;
    }
    if((el = e.target.closest('[data-action="save-po"]'))){
      if(!poDraft.supplier){ toast("Mohon pilih pemasok.", "error"); return; }
      if(poDraft.items.length===0){ toast("PO harus punya minimal satu item.", "error"); return; }
      var bad = poDraft.items.find(function(i){
        return !i.order_quantity || Number(i.order_quantity)<=0 || !i.unit_price || Number(i.unit_price)<=0;
      });
      if(bad){ toast("Mohon isi jumlah dan harga untuk semua item.", "error"); return; }

      el.disabled = true;
      try{
        var poNumRes = await sb.rpc("next_po_number");
        if(poNumRes.error) throw poNumRes.error;
        var poIns = await sb.from("purchase_orders").insert({
          po_number: poNumRes.data,
          po_date: todayIso(),
          supplier: poDraft.supplier,
          notes: poDraft.notes || "",
          status: "Open",
          created_by: session.user.id
        }).select().single();
        if(poIns.error) throw poIns.error;

        var itemRows = poDraft.items.map(function(i){
          return {
            po_id: poIns.data.id,
            plastic_type: i.plastic_type,
            size: i.size||"",
            unit: i.unit||"kg",
            order_quantity: Number(i.order_quantity),
            unit_price: Number(i.unit_price),
            request_id: i.request_id || null
          };
        });
        var itemsIns = await sb.from("purchase_order_items").insert(itemRows);
        if(itemsIns.error) throw itemsIns.error;

        // mark linked staff requests as ordered
        var reqIds = poDraft.items.filter(function(i){ return i.request_id; }).map(function(i){ return i.request_id; });
        if(reqIds.length){
          var updReq = await sb.from("purchase_requests")
            .update({ status:"Waiting for Shipment", ordered_at:new Date().toISOString(), supplier: poDraft.supplier, po_number: poNumRes.data })
            .in("id", reqIds);
          if(updReq.error) throw updReq.error;
        }

        toast("PO " + poNumRes.data + " dibuat.");
        await loadAll(); render();
        openPoView(poIns.data.id);
      } catch(err){
        console.error(err);
        toast("Gagal menyimpan PO ("+(err.message||"error")+").", "error");
      } finally {
        el.disabled = false;
      }
      return;
    }
    if((el = e.target.closest('[data-action="close-po-row"]'))){
      var closeId = el.getAttribute("data-id");
      var p = state.purchaseOrders.find(function(x){ return x.id===closeId; });
      if(!p) return;
      var items = itemsOfPo(p.id);
      var msg = "Tutup PO " + p.po_number + "?\n\n";
      var shortfalls = [];
      items.forEach(function(i){
        var ord = Number(i.order_quantity||0), got = Number(i.received_quantity||0);
        msg += "• " + i.plastic_type + ": dipesan " + fmtQty(ord,i.unit) + ", diterima " + fmtQty(got,i.unit) + "\n";
        if(Math.abs(ord-got) > 0.001){ shortfalls.push(i.plastic_type + " (" + fmtQty(got,i.unit) + " dari " + fmtQty(ord,i.unit) + ")"); }
      });
      if(shortfalls.length){ msg += "\nSelisih akan dicatat sebagai ditutup manual."; }
      if(!confirm(msg)) return;

      var patchC = { status:"Closed", closed_at:new Date().toISOString() };
      if(shortfalls.length){ patchC.close_note = "Ditutup manual: " + shortfalls.join("; ") + "."; }
      var updC = await sb.from("purchase_orders").update(patchC).eq("id", closeId);
      if(updC.error){ toast("Gagal menutup PO.", "error"); return; }

      var reqIds2 = items.filter(function(i){ return i.request_id; }).map(function(i){ return i.request_id; });
      if(reqIds2.length){
        await sb.from("purchase_requests").update({ status:"Received", closed_at:new Date().toISOString() }).in("id", reqIds2);
      }
      toast("PO ditutup.");
      await loadAll(); render(); return;
    }
  }

  async function handleChange(e){
    if(e.target.classList && e.target.classList.contains("invalid")){ e.target.classList.remove("invalid"); }

    // ---- PO builder fields (draft only, no DB writes) ----
    if(e.target.matches && e.target.matches('[data-role="po-supplier"]')){
      poDraft.supplier = e.target.value; return;
    }
    if(e.target.matches && e.target.matches('[data-role="po-notes"]')){
      poDraft.notes = e.target.value; return;
    }
    if(e.target.matches && e.target.matches('[data-role="item-qty"]')){
      var kq = e.target.getAttribute("data-key");
      var iq = poDraft.items.find(function(i){ return i.key===kq; });
      if(iq){ iq.order_quantity = e.target.value; renderPoBuilder(); }
      return;
    }
    if(e.target.matches && e.target.matches('[data-role="item-price"]')){
      var kp = e.target.getAttribute("data-key");
      var ip = poDraft.items.find(function(i){ return i.key===kp; });
      if(ip){ ip.unit_price = e.target.value; renderPoBuilder(); }
      return;
    }

    if(e.target.matches && e.target.matches('select[name="plasticType"]')){
      var sel = e.target;
      var hint = sel.parentElement.querySelector(".spec-hint");
      var t = findType(sel.value);
      if(hint){ hint.textContent = (t && t.size) ? ("Ukuran: " + t.size) : ""; }
      var form = sel.closest("form");
      if(form){
        var unitSel = form.querySelector('select[name="unit"]');
        var unitHint = form.querySelector(".unit-hint");
        var stockField = form.querySelector('[name="stock"]');
        if(unitSel){
          if(t){
            var locked = t.unit || (isRollSize(t.size) ? "roll" : "kg");
            unitSel.innerHTML = '<option value="'+locked+'" selected>'+locked+'</option>';
            if(unitHint) unitHint.textContent = "Otomatis: " + locked + " (mengikuti jenis plastik, tidak bisa diubah)";
          } else {
            unitSel.innerHTML = unitOptions(unitSel.value||"kg");
            if(unitHint) unitHint.textContent = "";
          }
        }
        if(stockField && t && t.current_stock!=null && !stockField.value){
          stockField.value = t.current_stock;
        }
      }
      return;
    }

    if(e.target.matches && e.target.matches('[data-role="stock-input"]')){
      if(!isAdmin()) return;
      var name = e.target.getAttribute("data-name");
      var val = e.target.value === "" ? null : Number(e.target.value);
      var upd = await sb.from("plastic_types").update({ current_stock: val }).eq("name", name);
      if(upd.error){ toast("Gagal menyimpan stok.", "error"); return; }
      toast("Stok diperbarui.");
      await loadAll();
      // don't full re-render to avoid losing focus on the input the admin just used
    }

    if(e.target.matches && e.target.matches('select[name="linkedRequestId"]')){
      var linkSel = e.target;
      var linkForm = linkSel.closest("form");
      var item = state.poItems.find(function(x){ return x.id===linkSel.value; });
      var closeWrap = document.getElementById("close-po-wrap");
      var progEl = linkForm ? linkForm.querySelector(".po-progress") : null;

      if(linkForm && item){
        var parentPo = state.purchaseOrders.find(function(p){ return p.id===item.po_id; });
        var typeSel = linkForm.querySelector('select[name="plasticType"]');
        if(typeSel){ typeSel.value = item.plastic_type; typeSel.dispatchEvent(new Event("change", {bubbles:true})); }
        var supF = linkForm.querySelector('select[name="supplier"]');
        if(supF && parentPo && parentPo.supplier){ supF.value = parentPo.supplier; }

        var ordered = Number(item.order_quantity||0);
        var got = Number(item.received_quantity||0);
        var remaining = Math.max(ordered - got, 0);

        var qtyF = linkForm.querySelector('[name="quantity"]');
        if(qtyF){ qtyF.value = remaining > 0 ? remaining : ""; }

        if(progEl){
          progEl.textContent = (parentPo?parentPo.po_number+" · ":"") + item.plastic_type +
                               " — dipesan " + fmtQty(ordered, item.unit) +
                               " · sudah diterima " + fmtQty(got, item.unit) +
                               " · sisa " + fmtQty(remaining, item.unit);
        }
        if(closeWrap){ closeWrap.style.display = ""; }
      } else {
        if(progEl) progEl.textContent = "";
        if(closeWrap){
          closeWrap.style.display = "none";
          var cb = closeWrap.querySelector('[name="closePo"]');
          if(cb) cb.checked = false;
        }
      }
      return;
    }

    if(e.target.matches && e.target.matches('[data-role="unit-select"]')){
      if(!isAdmin()) return;
      var unitName = e.target.getAttribute("data-name");
      var pickedUnit = e.target.value;
      var updU = await sb.from("plastic_types").update({ unit: pickedUnit }).eq("name", unitName);
      if(updU.error){ toast("Gagal menyimpan satuan.", "error"); return; }
      toast("Satuan " + unitName + " diubah menjadi " + pickedUnit + ".");
      await loadAll();
      // no full re-render, so the dropdown the admin just used keeps its place
      return;
    }

    if(e.target.matches && e.target.matches('[data-role="size-input"]')){
      if(!isAdmin()) return;
      var sizeName = e.target.getAttribute("data-name");
      var newSize = e.target.value.trim();
      // satuan sengaja tidak diubah di sini — diatur sendiri lewat dropdown Satuan
      var updS = await sb.from("plastic_types").update({ size: newSize }).eq("name", sizeName);
      if(updS.error){ toast("Gagal menyimpan ukuran.", "error"); return; }
      toast("Ukuran diperbarui.");
      await loadAll(); render();
    }
  }

  function wireEvents(){
    document.getElementById("nav").addEventListener("click", function(e){
      var btn = e.target.closest("button.tab-btn");
      if(btn){ activeTab = btn.getAttribute("data-tab"); render(); }
    });
    document.getElementById("logout-btn").addEventListener("click", async function(){
      await sb.auth.signOut();
      location.reload();
    });
    var app = document.getElementById("app");
    app.addEventListener("submit", handleFormSubmit);
    app.addEventListener("click", handleClick);
    app.addEventListener("change", handleChange);

    var overlay = document.getElementById("po-overlay");
    overlay.addEventListener("submit", handleFormSubmit);
    overlay.addEventListener("change", handleChange);
    overlay.addEventListener("click", function(e){
      if(e.target === overlay){ closePoModal(); return; }
      if(e.target.closest('[data-action="close-po"]')){ closePoModal(); return; }
      if(e.target.closest('[data-action="print-po"]')){ window.print(); return; }
      handleClick(e);
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ closePoModal(); }
    });
  }

  // ---------- boot ----------
  function showApp(){
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-shell").style.display = "block";
  }
  function showLogin(errMsg){
    document.getElementById("app-shell").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    var errEl = document.getElementById("login-error");
    if(errMsg){ errEl.textContent = errMsg; errEl.style.display = "block"; }
    else { errEl.style.display = "none"; }
  }

  async function boot(){
    var res = await sb.auth.getSession();
    session = res.data.session;
    if(!session){ showLogin(); return; }
    await afterLogin();
  }

  async function afterLogin(){
    profile = await loadProfile(session.user.id);
    await loadAll();
    wireEvents();
    subscribeRealtime();
    showApp();
    render();
  }

  document.getElementById("login-form").addEventListener("submit", async function(e){
    e.preventDefault();
    var username = document.getElementById("login-username").value;
    var password = document.getElementById("login-password").value;
    var btn = document.getElementById("login-submit");
    btn.disabled = true; btn.textContent = "Memproses…";
    try{
      session = await doLogin(username, password);
      await afterLogin();
    } catch(err){
      showLogin("Username atau password salah.");
    } finally {
      btn.disabled = false; btn.textContent = "Masuk";
    }
  });

  boot();
})();
</script>
</body>
</html>
